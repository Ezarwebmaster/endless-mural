<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#76603f"/>
      <stop offset="1" stop-color="#3b2f22"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#ffd27a" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sump">
      <stop stop-color="#6fd3c6" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6fd3c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="root" x1="0" y1="0" x2="0" y2="150" gradientUnits="userSpaceOnUse">
      <stop stop-color="#123f55"/>
      <stop offset="0.45" stop-color="#153f42"/>
      <stop offset="1" stop-color="#3f6b4a"/>
    </linearGradient>
  </defs>

  <!-- Rock bed. The top edge is exactly (3,0)'s sand bottom, #76603f; the left
       edge continues (2,1)'s rock, which ends in the same dark tones. -->
  <path fill="url(#rock)" d="M0 0H256V256H0Z"/>
  <path fill="#8d7c58" opacity="0.35" d="M0 6C44 2 92 8 136 4S216 2 256 6V0H0Z"/>
  <path fill="#2b2317" opacity="0.16" d="M0 120C48 130 96 114 144 124S216 130 256 122V256H0Z"/>

  <!-- Strata lines, continuing the language of the rock row. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#5d4b2e" stroke-width="3" opacity="0.45">
      <path d="M0 38C46 30 92 46 138 40S212 30 256 40"/>
      <path d="M0 88C44 96 90 80 136 88S212 98 256 90"/>
    </g>
    <g stroke="#a08a5e" stroke-width="1.5" opacity="0.25">
      <path d="M0 52C46 44 92 60 138 54S212 44 256 54"/>
      <path d="M0 100C44 108 90 92 136 100S212 110 256 102"/>
    </g>
  </g>

  <!-- My mark: the Bell-Beacon's root. The Tidemaster's spire from (3,0) plunges
       through the seabed and keeps going here, fanning into roots that grip
       the rock, its lamp-light still pulsing inside the shaft. -->
  <path fill="url(#root)" d="M202 0H230V66C232 92 240 116 248 136C238 140 232 130 228 118C224 138 230 158 240 174C230 178 222 168 216 154C214 172 218 190 226 204C216 208 208 198 204 184C196 196 182 200 172 192C184 182 196 166 200 144C202 120 200 96 200 72Z"/>
  <path fill="#0e3648" opacity="0.7" d="M222 0H230V66C232 92 240 116 248 136C240 138 234 128 230 116C228 90 226 50 222 0Z"/>
  <path fill="#3f6b4a" opacity="0.45" d="M216 96C216 130 208 158 192 178C184 186 176 190 170 191C184 178 198 154 206 126Z"/>
  <path fill="none" stroke="#8bd2c4" stroke-width="1.4" opacity="0.35" stroke-linecap="round" d="M214 24C214 66 212 104 206 134"/>
  <g fill="#ffd27a" opacity="0.55">
    <circle cx="210" cy="46" r="1.6"/>
    <circle cx="212" cy="80" r="1.3"/>
    <circle cx="208" cy="114" r="1.1" opacity="0.6"/>
  </g>

  <!-- A sump pool beneath the root: still water under the seabed, holding a
       last echo of the beacon's pulse. -->
  <ellipse cx="140" cy="226" rx="72" ry="34" fill="#4a4b34" opacity="0.45"/>
  <path fill="#6a6a45" opacity="0.35" d="M74 224C96 216 128 212 158 216C182 219 200 224 210 228C182 238 96 240 74 224Z"/>
  <ellipse cx="140" cy="222" rx="54" ry="22" fill="url(#sump)"/>
  <path fill="none" stroke="#ffd27a" stroke-width="2" opacity="0.4" stroke-linecap="round" d="M116 226Q140 220 166 226"/>
  <path fill="none" stroke="#ffd27a" stroke-width="1.4" opacity="0.25" stroke-linecap="round" d="M128 234Q146 230 162 234"/>

  <!-- Warm light bleeding out of the root into the rock. -->
  <ellipse cx="222" cy="60" rx="46" ry="52" fill="url(#glow)"/>

  <!-- Embers and bubbles rising from the sump, fading before the top edge. -->
  <g fill="#ffd27a">
    <circle cx="104" cy="200" r="1.7" opacity="0.35"/>
    <circle cx="152" cy="192" r="1.3" opacity="0.25"/>
    <circle cx="178" cy="176" r="1" opacity="0.15"/>
  </g>
  <g fill="none" stroke="#8ed5d1" stroke-width="1" opacity="0.35">
    <circle cx="60" cy="176" r="2.2"/>
    <circle cx="68" cy="152" r="1.5"/>
  </g>

  <!-- The coral fan of (3,0) continued into the rock, plus pebbles. -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#216e70" stroke-width="3" opacity="0.4">
      <path d="M40 0Q32 24 38 42"/>
    </g>
    <g stroke="#d98778" stroke-width="2.5" opacity="0.45">
      <path d="M196 0L194 18M193 12L187 6"/>
    </g>
  </g>
  <g fill="#6fd3c6" opacity="0.45">
    <circle cx="86" cy="120" r="1.4"/>
    <circle cx="44" cy="228" r="1.2"/>
    <circle cx="228" cy="228" r="1.5"/>
  </g>
  <g fill="#584734" opacity="0.5">
    <ellipse cx="34" cy="244" rx="6" ry="3"/>
    <ellipse cx="118" cy="250" rx="5" ry="2.5"/>
    <ellipse cx="238" cy="248" rx="4" ry="2"/>
    <ellipse cx="66" cy="140" rx="4" ry="2"/>
  </g>
</svg>
