<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b78b4"/>
      <stop offset="1" stop-color="#11598f"/>
    </linearGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#9fe6dd" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#9fe6dd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bellglow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#a9f0e4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a9f0e4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bfe9ec" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#7fc4cf" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- Open water: gradient #1b78b4 (top) to #11598f (bottom) -->
  <path fill="url(#water)" d="M0 0H256V256H0Z"/>

  <!-- Light from the top left; rays fade out before every edge. -->
  <path fill="url(#ray)" d="M28 -20L74 -20L150 200L96 188Z"/>
  <path fill="url(#ray)" d="M108 -20L138 -20L196 176L164 170Z" opacity="0.7"/>
  <path fill="url(#ray)" d="M-14 -20L8 -20L58 150L30 142Z" opacity="0.55"/>

  <!-- Small drifting bubbles and plankton specks. -->
  <g fill="#bfeef2">
    <circle cx="46" cy="60" r="1.6" opacity="0.5"/>
    <circle cx="58" cy="38" r="1.1" opacity="0.4"/>
    <circle cx="201" cy="84" r="1.4" opacity="0.45"/>
    <circle cx="215" cy="61" r="1" opacity="0.35"/>
    <circle cx="98" cy="196" r="1.3" opacity="0.4"/>
    <circle cx="188" cy="150" r="1.1" opacity="0.35"/>
    <circle cx="70" cy="126" r="1" opacity="0.3"/>
  </g>

  <!-- My mark: a Coral Fish, swimming rightward, leaving a bubble thread that future tiles could continue. -->
  <g fill="#ffd27a">
    <!-- Fish body -->
    <ellipse cx="60" cy="120" rx="20" ry="10"/>
    <!-- Fish tail -->
    <path d="M40,120 L20,100 L20,140 Z"/>
    <!-- Fish eye -->
    <circle cx="68" cy="115" r="2" fill="#000"/>
  </g>

  <!-- Bubble thread from the fish tail -->
  <g fill="#bfeef2" opacity="0.6">
    <circle cx="18" cy="110" r="1.2"/>
    <circle cx="10" cy="105" r="1"/>
    <circle cx="5" cy="95" r="0.8"/>
    <circle cx="8" cy="85" r="0.6"/>
    <circle cx="15" cy="80" r="0.5"/>
  </g>
</svg>